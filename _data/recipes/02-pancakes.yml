title: Pancakes
description: Kleine, lockere Pancakes, die außen goldbraun und innen fluffig werden.
category: Frühstück
time: 15 Min. + Ruhezeit
servings: 3
ingredients:
  - 2 Eier (Größe M)
  - 2 EL Zucker
  - 200 ml Milch
  - 1 Prise Salz
  - 200 g Mehl
  - 1 TL Backpulver
  - Etwas Öl zum Ausbacken
steps:
  - Eier und Zucker cremig aufschlagen. Die Milch dazugeben und unterrühren.
  - Salz, Mehl und Backpulver einrühren, bis ein glatter Teig entsteht.
  - Für besonders luftige Pancakes können die Eier getrennt und das steif geschlagene Eiweiß zuletzt vorsichtig untergehoben werden.
  - Den Teig einige Minuten ruhen lassen, damit das Mehl quellen kann.
  - Eine leicht geölte Pfanne bei mittlerer Hitze erwärmen. Jeweils eine kleine Kelle Teig hineingeben.
  - Sobald sich an der Oberfläche kleine Bläschen bilden, den Pancake wenden und die zweite Seite goldbraun backen. Der Teig ergibt etwa 10 Pancakes mit rund 10 cm Durchmesser.
