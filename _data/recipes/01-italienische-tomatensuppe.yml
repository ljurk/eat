title: Italienische Tomatensuppe
description: Eine schnelle, aromatische Tomatensuppe mit Oregano, Basilikum und Balsamico.
category: Suppe
time: 20 Min.
servings: 3
ingredients:
  - 1 kg stückige Tomaten aus der Dose
  - 1 mittelgroße Zwiebel
  - 1 Knoblauchzehe
  - 2 EL gutes Olivenöl
  - 2 TL getrockneter Oregano
  - 200 ml Gemüse- oder Hühnerbrühe
  - 25 g Tomatenmark
  - Salz
  - Frisch gemahlener schwarzer Pfeffer
  - Einige Zweige Basilikum
  - Etwas guter Aceto Balsamico
steps:
  - Zwiebel und Knoblauch schälen und fein hacken.
  - Die Hälfte des Olivenöls in einem Topf erhitzen. Zwiebel und Knoblauch darin glasig dünsten. Oregano und Tomatenmark kurz mit anschwitzen.
  - Tomaten und Brühe dazugeben, mit Salz und Pfeffer würzen und aufkochen. Zugedeckt etwa 5 Minuten köcheln lassen.
  - Basilikum waschen und die Blätter in feine Streifen schneiden.
  - Die Suppe fein pürieren und mit Balsamico abschmecken. Einen Teil des Basilikums unterrühren, den Rest darüberstreuen und mit dem übrigen Olivenöl beträufelt servieren.
